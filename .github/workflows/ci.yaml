# .github/workflows/tofu-ci.yml
name: "OpenTofu CI"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write     
  contents: read
  pull-requests: write

jobs:
  plan:
    name: "Plan [${{ matrix.environment }}]"
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    concurrency:
      group: tofu-ci-${{ matrix.environment }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      max-parallel: 1     
      fail-fast: true     
      matrix:
        environment: [dev, sit, prod]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials via Static Secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southteast-2


      - name: Execute Plan via Action
        uses: ./.github/actions/tofu-exec
        with:
          environment: ${{ matrix.environment }}
          command: plan