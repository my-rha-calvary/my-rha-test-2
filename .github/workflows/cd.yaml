name: "OpenTofu CD"

on:
  workflow_run:
    workflows: ["OpenTofu CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: "Apply [${{ matrix.environment }}]"
    # Runs only if manually dispatched or if CI was 100% green on main
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: tofu-cd-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      max-parallel: 1    
      fail-fast: true    
      matrix:
        environment: [dev, sit, prod]
    
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Configure AWS Credentials via Static Secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Execute Apply via Action
        uses: ./.github/actions/tofu-exec
        with:
          environment: ${{ matrix.environment }}
          command: apply